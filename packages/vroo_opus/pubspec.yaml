name: vroo_opus
description: "The Opus voice codec for Vroo: libopus 1.5.2 compiled from source by a build hook, with a small Dart API."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.7
dependencies:
  # code_assets stays on 1.x, which the app's objective_c (under path_provider) needs; native_toolchain_c follows.
  code_assets: ^1.2.0
  ffi: ^2.1.0
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.2
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
