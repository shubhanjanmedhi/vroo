name: Bug report
description: Something in the app, the box or the relay server doesn't work as it should.
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - The app
        - The box firmware
        - The relay server
        - The docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Start a ride on two phones\n2. ..."
  - type: input
    id: devices
    attributes:
      label: Phones, OS versions, and intercom or earphones
  - type: textarea
    id: log
    attributes:
      label: Ride log or screenshots
      description: Optional. Leave out anything personal, such as Wi-Fi names and passwords.
